<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
    <div id="container">
        <!--display and buttoms are equal in rank, in a column-->
        <div id="display">0</div>
        <div id="allBtns">
            <!--top and numberPad are equal in rank, in a column-->
            <div class = "leftBlock">
                <div class="top">
                    <!--doing that so i can easily manipulate the flex, could add more buttons to top-->
                    <button type="button" class="topBtn">AC</button>
                </div>
        
                <div id ="numberPad" class = "numbers">
                    <button type="button" class="numBtn">.</button>

                    <button type="button" class="numBtn">1</button>
                    <button type="button" class="numBtn">2</button>
                    <button type="button" class="numBtn">3</button>
        
                    <button type="button" class="numBtn">4</button>
                    <button type="button" class="numBtn">5</button>
                    <button type="button" class="numBtn">6</button>
        
                    <button type="button" class="numBtn">7</button>
                    <button type="button" class="numBtn">8</button>
                    <button type="button" class="numBtn">9</button>
        
    
                    <button type="button" class="numBtn">0</button>
                    
        
                </div>
            </div>
            
            <div class="actions rightBlock">
                <button type="button" class="actBtn">+</button>
                <button type="button" class="actBtn">-</button>
                <button type="button" class="actBtn">*</button>
                <button type="button" class="actBtn">/</button>
                <button type="button" class="actBtn">=</button>

            </div>
        </div>
        <!--here we got several options really, there gonna be a flux container that holds the buttoms, each line could be a flux line i would have five, or i could limit width
        and have them warp which... idk each button should be height 100 width 80? included the padding and margin-->
    </div>

    <script src="script.js"></script>
</body>
</html>
